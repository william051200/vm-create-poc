[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vm-create-bicep"
version = "0.1.0"
description = "Create a Linux VM from shared Bicep templates"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vm-create = "vm_create.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vm_create*"]

[tool.setuptools.package-data]
"vm_create.templates" = ["bicep/*.bicep"]
